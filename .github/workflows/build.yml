name: Build tvOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # 1.1.x carries on from the 1.0.x test builds, so a new build always installs over an old one.
      VERSION: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Clearbrowse.xcodeproj \
            -scheme Clearbrowse \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$(( ${{ github.run_number }} + 100 ))" \
            2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "(error|fatal error): " build.log | sort -u > errors.txt || true
          head -10 errors.txt | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          {
            echo "## Build errors"
            echo '```'
            head -150 errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/Clearbrowse.app Payload/
          zip -qry Clearbrowse.ipa Payload
          ls -lh Clearbrowse.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: Clearbrowse-${{ env.VERSION }}
          path: Clearbrowse.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Clearbrowse ${{ env.VERSION }}
          body: Unsigned tvOS build. Sideload it with atvloadly, which signs it with your Apple ID.
          files: Clearbrowse.ipa
          make_latest: true
